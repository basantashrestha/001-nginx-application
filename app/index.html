<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Application</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f3f6fa;
      }

      main {
        max-width: 40rem;
        margin: 2rem;
        padding: 2rem;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.5rem 2rem #17203314;
      }

      h1 {
        color: #00804a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to Basanta's Nginx Application</h1>
      <p>This page is served by nginx running in a Docker container.</p>
      <p>The container image is built and published to GitHub Container Registry using GitHub Actions.</p>
    </main>
  </body>
</html>
